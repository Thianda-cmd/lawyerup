<!doctype html>
<html><head><meta charset="utf-8"><title>BG sheet</title>
<link rel="stylesheet" href="/src/styles/portrait.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Special+Elite&family=Yellowtail&display=swap">
<style>body{margin:0;background:#111;display:flex;flex-wrap:wrap;gap:4px}
.s{position:relative;width:800px;height:450px;overflow:hidden}
.s>div{position:absolute;inset:0}.s svg.bg-svg{width:100%;height:100%;display:block}
.ch{position:absolute;bottom:0;left:50%;width:300px;height:450px;transform:translateX(-50%)}
.lbl{position:absolute;left:6px;top:4px;color:#fff;font:12px sans-serif;text-shadow:0 0 3px #000}</style></head>
<body><script type="module">
import { BACKGROUNDS } from '/src/art/backgrounds.ts';
import { portraitSVG } from '/src/art/cast.ts';
const q = new URLSearchParams(location.search);
const ids = (q.get('ids') ?? Object.keys(BACKGROUNDS).join(',')).split(',');
const chars = (q.get('c') ?? '').split(',');
ids.forEach((id, i) => {
  const b = BACKGROUNDS[id];
  const d = document.createElement('div'); d.className = 's';
  const c = chars[i % chars.length];
  d.innerHTML = `<div>${b.paint('b'+i)}</div>${c ? `<div class="ch">${portraitSVG(c,'neutral')}</div>` : ''}${b.fg ? `<div>${b.fg('f'+i)}</div>` : ''}<span class="lbl">${id}</span>`;
  document.body.appendChild(d);
});
</script></body></html>
